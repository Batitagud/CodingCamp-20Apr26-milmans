<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="greeting-section">
      <div id="datetime"></div>
      <h1 id="greeting">Good morning, Friend!</h1>
    </div>
    <div class="top-controls">
      <button id="theme-toggle" title="Toggle theme">🌙</button>
      <button id="edit-name-btn" title="Change name">✏️ Name</button>
    </div>
  </header>

  <!-- Name Modal -->
  <div id="name-modal" class="modal hidden">
    <div class="modal-box">
      <h2>What's your name?</h2>
      <input type="text" id="name-input" placeholder="Enter your name" maxlength="30" />
      <div class="modal-actions">
        <button id="save-name-btn">Save</button>
        <button id="cancel-name-btn" class="secondary">Cancel</button>
      </div>
    </div>
  </div>

  <main class="grid">

    <!-- Focus Timer -->
    <section class="card timer-card">
      <h2>Focus Timer</h2>
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="timer-controls">
        <button id="timer-start">▶ Start</button>
        <button id="timer-stop" class="secondary">⏸ Pause</button>
        <button id="timer-reset" class="secondary">↺ Reset</button>
      </div>
      <div class="timer-settings">
        <label>Duration (min):
          <input type="number" id="pomodoro-duration" min="1" max="120" value="25" />
        </label>
      </div>
    </section>

    <!-- To-Do List -->
    <section class="card todo-card">
      <h2>To-Do List</h2>
      <div class="todo-input-row">
        <input type="text" id="todo-input" placeholder="Add a task..." maxlength="100" />
        <button id="todo-add">Add</button>
      </div>
      <ul id="todo-list"></ul>
    </section>

    <!-- Quick Links -->
    <section class="card links-card">
      <h2>Quick Links</h2>
      <div class="link-input-row">
        <input type="text" id="link-name" placeholder="Label" maxlength="20" />
        <input type="url" id="link-url" placeholder="https://..." />
        <button id="link-add">Add</button>
      </div>
      <div id="links-grid"></div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
